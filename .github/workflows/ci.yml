name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        shell: bash
        run: |
          if mvn --batch-mode --no-transfer-progress test; then
            exit 0
          fi

          for report in target/surefire-reports/*.txt; do
            if grep -Eq 'Failures: [1-9]|Errors: [1-9]|<<< FAILURE|<<< ERROR' "$report"; then
              details="$(tr '\r\n' '  ' < "$report" | cut -c1-4000)"
              echo "::error file=${report}::${details}"
            fi
          done
          exit 1

      - name: Build course checkpoints
        shell: bash
        run: bash checkpoints/verify.sh --compile-only
